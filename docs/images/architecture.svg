<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="950" viewBox="0 0 1280 950" role="img" aria-labelledby="title desc"><title id="title">HiMorning system architecture</title><desc id="desc">Native iOS and planned Android use shared contracts and a single Firebase verification service.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;fill:#203047}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#526176}.h{font-size:22px;font-weight:700}.b{font-size:18px}.small{font-size:16px;fill:#526176}.edge{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker></defs><rect width="1280" height="950" fill="#fffaf0"/><text x="48" y="65" class="title">One service. Native mornings.</text><text x="48" y="100" class="sub">HiMorning architecture • implemented iOS pilot, planned Android client</text><rect x="48" y="150" width="340" height="380" rx="22" fill="#fff2c8" stroke="#c7d1df" stroke-width="2"/><text x="72" y="190" class="h">iOS • implemented</text><text x="72" y="227" class="b">apps/ios</text><text x="72" y="257" class="b">SwiftUI · English + Vietnamese</text><text x="72" y="287" class="b">Swift domain + local journal</text><text x="72" y="317" class="b">AlarmKit alarm adapter</text><text x="72" y="347" class="b">AVFoundation + Vision</text><text x="72" y="377" class="b">Firebase callable adapter</text><rect x="892" y="150" width="340" height="380" rx="22" fill="#f8fafc" stroke="#c7d1df" stroke-width="2" stroke-dasharray="8 6"/><text x="916" y="190" class="h">Android • planned</text><text x="916" y="227" class="b">apps/android</text><text x="916" y="257" class="b">Kotlin + Compose candidate</text><text x="916" y="287" class="b">Own domain + persistence</text><text x="916" y="317" class="b">AlarmManager + receivers</text><text x="916" y="347" class="b">CameraX + pose adapter</text><text x="916" y="377" class="b">Same Firebase callables</text><rect x="444" y="150" width="392" height="182" rx="22" fill="#ffffff" stroke="#c7d1df" stroke-width="2"/><text x="468" y="190" class="h">Shared agreement</text><text x="468" y="227" class="b">shared/contracts/v1</text><text x="468" y="257" class="b">JSON Schema + wire fixtures</text><text x="468" y="287" class="b">Mode presets + parity tests</text><path d="M388 240 H444" class="edge"/><path d="M892 240 H836" class="edge" stroke-dasharray="8 6"/><text x="462" y="371" class="small">Contracts are data, not a mobile runtime.</text><rect x="444" y="410" width="392" height="230" rx="22" fill="#e8f4ec" stroke="#c7d1df" stroke-width="2"/><text x="468" y="450" class="h">Verification service</text><text x="468" y="487" class="b">backend/functions</text><text x="468" y="517" class="b">Auth + App Check · owned sessions</text><text x="468" y="547" class="b">Consent · expiry · quotas</text><text x="468" y="577" class="b">One bounded provider attempt</text><text x="468" y="607" class="b">Server decides; stop stays local</text><path d="M388 458 H444" class="edge"/><path d="M892 458 H836" class="edge" stroke-dasharray="8 6"/><rect x="260" y="706" width="354" height="122" rx="22" fill="#ffffff" stroke="#c7d1df" stroke-width="2"/><text x="284" y="746" class="h">Firestore</text><text x="284" y="783" class="b">Session / quota metadata</text><text x="284" y="813" class="b">No stored camera images</text><rect x="666" y="706" width="354" height="122" rx="22" fill="#ffffff" stroke="#c7d1df" stroke-width="2"/><text x="690" y="746" class="h">Qwen / Modal</text><text x="690" y="783" class="b">Bounded ordered JPEG evidence</text><text x="690" y="813" class="b">Structured result + token limits</text><path d="M540 640 V675 H437 V706" class="edge"/><path d="M740 640 V675 H843 V706" class="edge"/><text x="48" y="884" class="small">Solid cards / arrows: implemented. Dashed Android card / arrows: future work.</text><text x="48" y="915" class="small">Local alarm delivery and explicit stop do not depend on cloud verification.</text></svg>