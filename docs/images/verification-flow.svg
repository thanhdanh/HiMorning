<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="950" viewBox="0 0 1280 950" role="img" aria-labelledby="title desc"><title id="title">HiMorning verification sequence</title><desc id="desc">Consent, session creation, ordered evidence, bounded inference and validated results with explicit stop available.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;fill:#203047}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#526176}.h{font-size:22px;font-weight:700}.b{font-size:18px}.small{font-size:16px;fill:#526176}.edge{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker></defs><rect width="1280" height="950" fill="#fffaf0"/><text x="48" y="65" class="title">From consent to a clear result</text><text x="48" y="100" class="sub">A challenge is optional. A late cloud result cannot undo a stop.</text><rect x="30" y="140" width="200" height="60" rx="18" fill="#fff2c8" stroke="#d6c8a4"/><text x="52" y="178" class="h">Person</text><path d="M130 205 V760" fill="none" stroke="#c7d1df" stroke-width="2" stroke-dasharray="5 6"/><rect x="365" y="140" width="200" height="60" rx="18" fill="#fff2c8" stroke="#d6c8a4"/><text x="387" y="178" class="h">Native app</text><path d="M465 205 V760" fill="none" stroke="#c7d1df" stroke-width="2" stroke-dasharray="5 6"/><rect x="700" y="140" width="200" height="60" rx="18" fill="#fff2c8" stroke="#d6c8a4"/><text x="722" y="178" class="h">Firebase service</text><path d="M800 205 V760" fill="none" stroke="#c7d1df" stroke-width="2" stroke-dasharray="5 6"/><rect x="1035" y="140" width="200" height="60" rx="18" fill="#fff2c8" stroke="#d6c8a4"/><text x="1057" y="178" class="h">OpenAI</text><path d="M1135 205 V760" fill="none" stroke="#c7d1df" stroke-width="2" stroke-dasharray="5 6"/><path d="M130 256 H465" class="edge"/><text x="142" y="244" class="small">Choose challenge + consent</text><path d="M465 330 H800" class="edge"/><text x="477" y="318" class="small">Create owned session</text><path d="M800 400 H465" class="edge"/><text x="477" y="388" class="small">Nonce + expiry + image limits</text><rect x="375" y="426" width="180" height="58" rx="12" fill="#ffffff" stroke="#c7d1df"/><text x="391" y="451" class="small">Capture in foreground</text><text x="391" y="473" class="small">Select ordered phases</text><path d="M465 525 H800" class="edge"/><text x="477" y="513" class="small">Submit once; reserve quota</text><path d="M800 590 H1135" class="edge"/><text x="812" y="578" class="small">Bounded images + output</text><path d="M1135 653 H800" class="edge"/><text x="812" y="641" class="small">Structured verdict</text><path d="M800 720 H465" class="edge"/><text x="477" y="708" class="small">Validate current session; apply result</text><rect x="48" y="805" width="1184" height="132" rx="22" fill="#e8f4ec" stroke="#c7d1df" stroke-width="2"/><text x="72" y="845" class="h">Stop, interruption or uncertain result</text><text x="72" y="882" class="b">Stop remains available. Cancel / expire the session and ignore late success.</text><text x="72" y="912" class="b">Self-confirmed, AI-verified and dismissed remain distinct outcomes.</text></svg>