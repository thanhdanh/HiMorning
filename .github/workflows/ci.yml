name: HiMorning checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    types: [closed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A merged PR cancels its head branch's runs; the closed event never needs a runner.
  group: >-
    checks-${{ github.event_name == 'pull_request'
      && (github.event.pull_request.merged
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref != github.event.repository.default_branch
      && format('refs/heads/{0}', github.event.pull_request.head.ref)
      || format('closed-pr-{0}', github.event.pull_request.number))
      || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, ARM64, himorning]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run build:worker
      - run: node scripts/export-contracts.mjs
      - run: git diff --exit-code -- shared/contracts/v1/verification.schema.json backend/inference/verdict.schema.json
      - run: node scripts/prepare-firebase.mjs
      - run: pnpm --dir .firebase/functions install --prod --frozen-lockfile
      - run: node -e "import('./.firebase/functions/lib/index.js')"
      - run: pnpm run test:coverage
      - run: pnpm audit --prod
  inference:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, ARM64, himorning]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11 from Homebrew
        run: |
          brew list --versions python@3.11 >/dev/null || brew install python@3.11
          "$(brew --prefix python@3.11)/bin/python3.11" -m venv backend/inference/.venv
      - run: backend/inference/.venv/bin/python -m pip install -r backend/inference/requirements.lock
      - run: backend/inference/.venv/bin/python -m unittest discover -s backend/inference -p 'test_*.py' -v
      - run: cd backend/inference && .venv/bin/python -c "import app"
  ios:
    if: github.event_name != 'pull_request'
    needs: backend
    runs-on: [self-hosted, macOS, ARM64, himorning]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/test-swift.sh
      - run: swift test --package-path apps/ios/HiMorningCore
      - run: command -v xcodegen || brew install xcodegen
      - run: xcodegen generate --spec apps/ios/project.yml
      - name: Select iOS 26.2 for StoreKitTest compatibility
        id: simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/himorning-devices.json"
          python3 - <<'PYDEVICE'
          import json,os
          devices=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'himorning-devices.json')))['devices']
          # shortcut: iOS 26.2 avoids the StoreKitTest CLI regression; upgrade when a fixed simulator is available.
          runtime='com.apple.CoreSimulator.SimRuntime.iOS-26-2'
          device=next(d for d in devices.get(runtime,[]) if d.get('isAvailable') and d['name'].startswith('iPhone'))
          print('Selected '+device['name']+' on '+runtime)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('id='+device['udid']+'\n')
          PYDEVICE
      - name: Test native units and language journeys (smoke on push, full on manual run)
        id: ui
        run: sh scripts/test-ios.sh '${{ steps.simulator.outputs.id }}' '${{ github.event_name }}'
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/himorning-ui.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/himorning-ui.xcresult" --output-path "$RUNNER_TEMP/himorning-ui-attachments"
          fi
      - name: Export native coverage
        if: success()
        run: xcrun xccov view --report --json "$RUNNER_TEMP/himorning-ui.xcresult" > "$RUNNER_TEMP/himorning-ui-attachments/native-coverage.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ui-evidence
          path: ${{ runner.temp }}/himorning-ui-attachments
          retention-days: 7
