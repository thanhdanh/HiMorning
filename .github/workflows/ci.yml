name: HiMorning checks
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: [self-hosted, macOS, ARM64, himorning]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: node scripts/export-contracts.mjs
      - run: git diff --exit-code -- shared/contracts/v1/verification.schema.json
      - run: node scripts/prepare-firebase.mjs
      - run: pnpm --dir .firebase/functions install --prod --frozen-lockfile
      - run: node -e "import('./.firebase/functions/lib/index.js')"
      - run: pnpm run test:coverage
      - run: pnpm audit --prod
  ios:
    runs-on: [self-hosted, macOS, ARM64, himorning]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/test-swift.sh
      - run: swift test --package-path apps/ios/HiMorningCore
      - run: command -v xcodegen || brew install xcodegen
      - run: xcodegen generate --spec apps/ios/project.yml
      - name: Build native pilot with simulator SDK
        run: xcodebuild -project apps/ios/HiMorning.xcodeproj -scheme HiMorning -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath '${{ runner.temp }}/himorning-derived' CODE_SIGNING_ALLOWED=NO build
      - name: Select iOS 26.2 for StoreKitTest compatibility
        id: simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/himorning-devices.json"
          python3 - <<'PYDEVICE'
          import json,os
          devices=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'himorning-devices.json')))['devices']
          # shortcut: iOS 26.2 avoids the StoreKitTest CLI regression; upgrade when a fixed simulator is available.
          runtime='com.apple.CoreSimulator.SimRuntime.iOS-26-2'
          device=next(d for d in devices.get(runtime,[]) if d.get('isAvailable') and d['name'].startswith('iPhone'))
          print('Selected '+device['name']+' on '+runtime)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('id='+device['udid']+'\n')
          PYDEVICE
      - name: Test native language journeys
        id: ui
        run: xcodebuild -project apps/ios/HiMorning.xcodeproj -scheme HiMorning -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -derivedDataPath '${{ runner.temp }}/himorning-derived' CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- -collect-test-diagnostics never -resultBundlePath '${{ runner.temp }}/himorning-ui.xcresult' test
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/himorning-ui.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/himorning-ui.xcresult" --output-path "$RUNNER_TEMP/himorning-ui-attachments"
          fi
      - name: Export native coverage
        if: success()
        run: xcrun xccov view --report --json "$RUNNER_TEMP/himorning-ui.xcresult" > "$RUNNER_TEMP/himorning-ui-attachments/native-coverage.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ui-evidence
          path: ${{ runner.temp }}/himorning-ui-attachments
          retention-days: 7
