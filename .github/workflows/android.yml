name: Android checks
on:
  push:
    branches: [main, 'codex/**']
    paths: ['apps/android/**', 'shared/contracts/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile, test and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-evidence
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/reports/tests/testDebugUnitTest
            apps/android/app/build/reports/lint-results-debug.html
          retention-days: 7
