name: HiMorning
options:
  bundleIdPrefix: com.himorning
  deploymentTarget:
    iOS: "26.0"
packages:
  HiMorningCore:
    path: HiMorningCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 13.0.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "1"
targets:
  HiMorning:
    type: application
    platform: iOS
    sources: [HiMorning]
    resources: [Resources]
    info:
      path: HiMorning/Info.plist
      properties:
        CFBundleDisplayName: HiMorning
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAlarmKitUsageDescription: HiMorning cần quyền đặt báo thức để giúp bạn bắt đầu ngày mới đúng giờ.
        NSCameraUsageDescription: Camera chỉ mở khi bạn chọn nhiệm vụ. Một số khung hình được gửi đến OpenAI sau khi bạn đồng ý.
    dependencies:
      - package: HiMorningCore
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseAppCheck
  HiMorningUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HiMorningUITests]
    dependencies:
      - target: HiMorning
    settings:
      GENERATE_INFOPLIST_FILE: YES
schemes:
  HiMorning:
    build:
      targets:
        HiMorning: all
    test:
      targets: [HiMorningUITests]
