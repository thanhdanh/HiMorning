- tapOn: "Push-ups"
- tapOn: "Start"
- tapOn: "Open camera"
- assertVisible: "0 / 5"
- tapOn: "Back to home"
- tapOn: "Explore challenges"
- scrollUntilVisible:
    element: "Jumping jacks"
    direction: DOWN
- tapOn: "Jumping jacks"
- tapOn: "Start"
- assertVisible: "0 / 10"
- tapOn: "Back to home"
- tapOn: "Explore challenges"
- scrollUntilVisible:
    element: "Raise your arms"
    direction: DOWN
- tapOn: "Raise your arms"
- tapOn: "Start"
- assertVisible: "0 / 3"
- tapOn: "Back to home"
- tapOn: "Explore challenges"
- scrollUntilVisible:
    element: "Follow the rhythm"
    direction: DOWN
- tapOn: "Follow the rhythm"
- tapOn: "Start"
- assertVisible: "0 / 3"
- tapOn: "Back to home"
