appId: com.himorning.android
---
- launchApp
- tapOn: "Explore challenges"
- assertVisible: "Camera-free"
- assertVisible: "Gentle & close framing"
- tapOn: "Read & Pick"
- assertVisible: "Another prompt"
- tapOn: "Back to home"
- tapOn: "Explore challenges"
- tapOn: "Riddle"
- assertVisible: "Another prompt"
- tapOn: "Back to home"
- tapOn: "Explore challenges"
- tapOn: "Read aloud"
- assertVisible: "Hear an example"
- assertVisible: "Read aloud now"
- tapOn: "Back to home"
- tapOn: "Explore challenges"
- tapOn: "No challenge"
- assertVisible: "No challenge"
- tapOn: "Back to home"
- tapOn: "Explore challenges"
- tapOn: "Morning light"
- tapOn: "Start"
- tapOn: "Open camera"
- tapOn: "Back to home"
- tapOn: "Explore challenges"
- tapOn: "Wave your hand"
- tapOn: "Start"
- assertVisible: "0 / 3"
- tapOn: "Back to home"
- tapOn: "Explore challenges"
- tapOn: "Neck turns"
- tapOn: "Start"
- assertVisible: "0 / 3"
- tapOn: "Back to home"
- tapOn: "Explore challenges"
- scrollUntilVisible:
    element: "Push-ups"
